services:
  # Next.js Full Stack Web Dashboard & API Route Handlers
  - type: web
    name: autonomous-job-hunter-web
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=web
    startCommand: npm run start --workspace=web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  # NestJS Dedicated Backend API Service (Optional if running decoupled)
  - type: web
    name: autonomous-job-hunter-api
    env: node
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build --workspace=api
    startCommand: npm run start:prod --workspace=api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: job-hunter-db
          property: connectionString

databases:
  - name: job-hunter-db
    plan: free
    databaseName: jobhunter
    user: jobhunter
