name: Daily Freelance Project Discovery & Quality Check

on:
  schedule:
    # Runs daily at 08:00 UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  discover-and-verify:
    name: Run Automated Discovery & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Types
        run: npm run db:generate

      - name: Run E2E Automation Suite
        run: npm test

      - name: Summary
        run: |
          echo "Daily Freelancer Project Discovery & Verification completed successfully."
          echo "Time: $(date -u)"
